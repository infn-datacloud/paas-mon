      #KAFKA_CLUSTERS_0_NAME: "local"
      #KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka-broker:9092"
      #KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
