[agent]
  flush_interval = "5s"
  omit_hostname = true

# --- INPUT: Kafka -> Influx Line Protocol ---
[[inputs.kafka_consumer]]
  brokers = ["${KAFKA_BOOTSTRAP_SERVERS}"]
  topics = ["${KAFKA_OUTPUT_TOPIC}"]
  consumer_group = "${TELEGRAF_CONSUMER_GROUP}"  
  offset = "newest"
  data_format = "influx"
  version = "4.0.0"
  max_message_len = 0
 
 
# --- OUTPUT: InfluxDB v2 ---
[[outputs.influxdb_v2]]
  urls          = ["http://influxdb:8086"]
  token         = "${INFLUX_TELEGRAF_TOKEN}"
  organization  = "${DOCKER_INFLUXDB_INIT_ORG}"
  bucket        = "${DOCKER_INFLUXDB_INIT_BUCKET}"
  timeout       = "5s"



