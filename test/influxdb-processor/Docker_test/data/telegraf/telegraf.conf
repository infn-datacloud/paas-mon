[agent]
  flush_interval = "5s"
  omit_hostname = true

# --- INPUT: Kafka -> Influx Line Protocol ---
[[inputs.kafka_consumer]]
  brokers = ["kafka-broker:9092"]
  topics = ["paas_mon_processed"]
  consumer_group = "Telegraf_group-1"   
  offset = "oldest"
  data_format = "influx"
  version = "3.7.0"
  max_message_len = 0
 
 
# --- OUTPUT: InfluxDB v2 ---
[[outputs.influxdb_v2]]
  urls          = ["http://influxdb:8086"]
  token         = "$INFLUX_TOKEN"
  organization  = "INFN"
  bucket        = "feeder_metrics"
  timeout       = "5s"



