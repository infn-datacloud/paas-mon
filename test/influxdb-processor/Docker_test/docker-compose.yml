networks:
  kafka_net:
    driver: bridge

services:
  influxdb:
    build:
      context: .
      dockerfile: ./influxdb/Dockerfile.influxdb
    container_name: influxdb
    ports:
      - "8086:8086"
    networks: 
      - kafka_net
    env_file:
      - .env
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN_FILE=/generated_admin_token
      - DOCKER_INFLUXDB_INIT_RETENTION=0
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
    volumes:
      -  influxdb_data:/var/lib/influxdb2
      -  grafana_tokens:/tokens/grafana:rw
      -  telegraf_tokens:/tokens/telegraf:rw
      -  admin_tokens:/tokens/admin
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka-broker:
    image: apache/kafka:4.0.0
    container_name: kafka-broker
    hostname: kafka-broker
    networks:
      - kafka_net
    ports:
      - "${KAFKA_INTERNAL_PORT}:${KAFKA_INTERNAL_PORT}"
      - "${KAFKA_CONTROLLER_PORT}:${KAFKA_CONTROLLER_PORT}"
      - "${KAFKA_EXTERNAL_PORT}:${KAFKA_EXTERNAL_PORT}"
    env_file: .env
    environment:
      KAFKA_NODE_ID: "1"
      CLUSTER_ID: D9Jv0j4TRpS90mYQh_8hAA
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL_LOCALHOST:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL_LOCALHOST"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@${ADVERTISED_HOST_INTERNAL}:${KAFKA_CONTROLLER_PORT}"
      KAFKA_LISTENERS: "INTERNAL_LOCALHOST://0.0.0.0:${KAFKA_INTERNAL_PORT},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT},EXTERNAL://0.0.0.0:${KAFKA_EXTERNAL_PORT}"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL_LOCALHOST://${ADVERTISED_HOST_INTERNAL}:${KAFKA_INTERNAL_PORT},EXTERNAL://${ADVERTISED_HOST_EXTERNAL}:${KAFKA_EXTERNAL_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:${KAFKA_INTERNAL_PORT} > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10


  feeder_loader:
    build:
      context: ../../../
      dockerfile: ./test/influxdb-processor/Docker_test/feeder_loader/Dockerfile
      args:
        PYTHON_VERSION: "3.10"
        POETRY_VERSION: "1.8.3"
    container_name: feeder_loader
    networks:
      - kafka_net
    env_file: .env
    environment:
      PYTHONPATH: "./feeder_loader/scripts/modules:${PYTHONPATH}"
    volumes:
      - ./feeder_loader/scripts:/feeder_loader/scripts
    depends_on:  
        kafka-broker:
            condition: service_healthy
    restart: "no"

  app_processor:
    build:
      context: ../../../
      dockerfile: ./test/influxdb-processor/Docker_test/app/Dockerfile
      args:
        PYTHON_VERSION: "3.10"
        POETRY_VERSION: "1.8.3"
    container_name: app_processor
    networks:
      - kafka_net
    env_file: .env
    environment:
      PYTHONPATH: "./app/scripts/modules:${PYTHONPATH}"
    volumes:
      - ./app/scripts:/app/scripts
    depends_on:  
        kafka-broker:
            condition: service_healthy
    restart: "no"

  telegraf:
    build:
      context: .
      dockerfile: ./telegraf/Dockerfile.telegraf
    container_name: telegraf
    depends_on:
      kafka-broker:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    networks: 
      - kafka_net
    env_file:
      - .env
    environment:
      - TELEGRAF_CONSUMER_GROUP=Telegraf_group
    volumes:
      - ./data/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - telegraf_tokens:/tokens/telegraf:ro
    restart: unless-stopped

  grafana:
    build:
      context: .
      dockerfile: ./grafana/Dockerfile.grafana
    container_name: grafana
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks: 
      - kafka_net
    env_file: .env
    environment:
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./data/grafana/provisioning:/etc/grafana/provisioning
      - ./data/grafana/dashboards:/etc/grafana/dashboards
      - grafana_tokens:/tokens/grafana:ro
    restart: unless-stopped


